server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types application/javascript application/json application/manifest+json text/css text/html;
    gzip_min_length 1024;

    # the service worker and shell must never be cached stale by proxies
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = / { add_header Cache-Control "no-cache"; }

    # everything else can cache briefly; the service worker handles offline
    location / {
        add_header Cache-Control "max-age=3600";
        try_files $uri $uri/ =404;
    }
}
