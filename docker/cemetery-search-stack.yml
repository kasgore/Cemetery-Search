# Cemetery Search — Portainer stack (upload this file, or paste it in the web editor).
#
# ONE address that works everywhere, including cellular:
#     https://rpidocker.tail85744b.ts.net:8443/
#     (or https://100.70.196.66:8443/ )
#
# Why no macvlan any more: a macvlan container gets its own LAN IP but is
# invisible to its own host, and Tailscale runs ON the host — so it could
# never forward to 192.168.5.14. That is exactly why photos and map tiles
# only moved once Wi-Fi came on. Publishing ports on the host instead means
# Tailscale serves the app from anywhere, and the home LAN can still reach
# it at the Pi's own address on the same ports.
#
# Use that one URL on the phone AND the PC: browser storage is per-address,
# so sticking to a single URL keeps one set of marks and photos on each
# device (they sync through the Pi either way).
#
# Accept the self-signed certificate warning once per device; the cert
# covers the names in CERT_HOSTS below.
services:
  cemetery-search:
    image: cemetery-search:latest
    container_name: cemetery-search
    restart: unless-stopped
    ports:
      - "8420:80"     # http
      - "8443:443"    # https — use this one (GPS/compass need a secure page)
    environment:
      PORT: "80"
      HTTPS_PORT: "443"
      REFRESH_HOURS: "6"
      RADIUS_MILES: "15"
      CERT_HOSTS: "rpidocker.tail85744b.ts.net,100.70.196.66,192.168.5.14,localhost"
      TZ: "America/New_York"
    volumes:
      - cemetery_data:/data   # keeps your field log, photos and caches across rebuilds

volumes:
  cemetery_data:
