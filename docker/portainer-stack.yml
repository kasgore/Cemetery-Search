# Cemetery Search — Portainer WEB-EDITOR stack (no build).
#
# House pattern (same as the sportsbets container): the container joins the
# existing macvlan "InternalNetwork" and gets its own LAN IP — no port
# mapping, so the app itself listens on 80/443 (PORT/HTTPS_PORT overrides).
#
# Image first: Portainer > Images > Build a new image > name
# cemetery-search:latest > Upload > docker/cemetery-search-build.tar
# (rebuild it any time with docker/build.ps1).
#
# macvlan quirk: the Pi itself can't reach 192.168.5.14 — every OTHER
# device on the LAN can.
services:
  cemetery-search:
    image: cemetery-search:latest
    container_name: cemetery-search
    restart: unless-stopped
    environment:
      PORT: "80"                  # macvlan: listen on the real ports
      HTTPS_PORT: "443"
      REFRESH_HOURS: "6"          # photo-request refresh cadence
      RADIUS_MILES: "15"          # auto-include cemeteries with requests within this range
      CERT_HOSTS: "192.168.5.14,localhost"   # SANs for the self-signed https cert
      TZ: "America/New_York"
    volumes:
      - cemetery_data:/data       # caches + refreshed dataset survive rebuilds
    networks:
      InternalNetwork:
        ipv4_address: 192.168.5.14

volumes:
  cemetery_data:

networks:
  InternalNetwork:
    external: true                # join the EXISTING macvlan, don't create one
