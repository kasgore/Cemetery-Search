# Cemetery Search — reachable on ports 80 (http) and 443 (https).
#
# This file is for repo-based deploys (Portainer repository mode or
# `docker compose up` from a checkout). For the Pi's web-editor + image
# workflow use docker/cemetery-search-stack.yml instead — it has no build block.
#
# The app listens on 8420/8443 inside the container; the stack maps the
# standard ports onto them (change only the left-hand numbers if 80/443 are
# taken on the host).
#
# TWO WAYS to put it on 192.168.5.14 — use exactly one:
#
# A) The Pi itself is 192.168.5.14 (or you don't care which host IP):
#    keep the `ports:` block below and DELETE the `networks:` blocks.
#
# B) The CONTAINER gets its own dedicated LAN IP 192.168.5.14 (macvlan):
#    delete the `ports:` block, uncomment the `networks:` blocks AND the
#    PORT/HTTPS_PORT env overrides (macvlan has no port mapping — the app
#    must listen on 80/443 itself), and set `parent:` to the Pi's LAN
#    interface (usually eth0).
#    (macvlan quirk: the Pi host itself can't reach the container's IP;
#    other devices on the LAN can.)
services:
  cemetery-search:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cemetery-search:latest
    container_name: cemetery-search
    restart: unless-stopped
    ports:
      - "80:8420"     # http
      - "443:8443"    # https (self-signed)
    environment:
      REFRESH_HOURS: "6"          # photo-request refresh cadence
      RADIUS_MILES: "15"          # auto-include cemeteries with requests within this range
      CERT_HOSTS: "192.168.5.14,localhost"   # SANs for the self-signed https cert
      # PORT: "80"                # macvlan only (option B)
      # HTTPS_PORT: "443"         # macvlan only (option B)
    volumes:
      - cemetery_data:/data       # caches + refreshed dataset survive rebuilds
    # networks:
    #   lan:
    #     ipv4_address: 192.168.5.14

volumes:
  cemetery_data:

